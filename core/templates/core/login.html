
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Career Gateway</title>
</head>
<body>
    <h1>Welcome Back to Career Gateway</h1>
    <p>Log in to continue exploring your career options.</p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <button type="submit">Log In</button>
    </form>

    <p>New to Career Gateway? <a href="{% url 'signup' %}">Create an account</a></p>
</body>
</html>
