{% extends "core/base.html" %}

{% block title %}Log In | Career Gateway{% endblock %}
{% block container_class %}narrow{% endblock %}

{% block content %}
    <h1>Welcome back</h1>
    <p>Log in to continue exploring your career options.</p>

    <form method="POST">
        {% csrf_token %}

        <div class="form-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" autofocus required>
        </div>

        <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>
        </div>

        <button type="submit" class="button full">Log In</button>
    </form>

    <p class="form-footer">
        New to Career Gateway?
        <a href="{% url 'signup' %}">Create an account</a>
    </p>
{% endblock %}
