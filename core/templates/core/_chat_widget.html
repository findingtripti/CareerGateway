<div id="cg-chat" class="cg-chat" aria-label="Ask Career Gateway">
    <button type="button" id="cg-chat-toggle" class="cg-chat-toggle" aria-expanded="false" aria-controls="cg-chat-panel" hidden>Ask a question</button>
    <div id="cg-chat-panel" class="cg-chat-panel" hidden>
        <form id="cg-chat-form" action="{% url 'ask' %}" method="get" role="search">
            <label for="cg-chat-q"><strong>Ask Career Gateway</strong></label>
            <input id="cg-chat-q" name="q" type="text" maxlength="200" placeholder="For example: what is an entrance exam?" autocomplete="off">
            <button type="submit">Ask</button>
        </form>
        <div id="cg-chat-out" aria-live="polite"></div>
        <p class="cg-chat-note">Answers come from Career Gateway records, not from general AI knowledge. A counsellor can help with personal decisions.</p>
    </div>
    <noscript><a class="cg-chat-link" href="{% url 'ask' %}">Ask a question</a></noscript>
</div>
<style>
    .cg-chat { position: fixed; right: 16px; bottom: 16px; z-index: 50; font-family: Arial, sans-serif; }
    .cg-chat-toggle, .cg-chat-link { background: #243b6b; color: #fff; border: 0; border-radius: 999px; padding: 12px 18px; font-size: 15px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); text-decoration: none; display: inline-block; }
    .cg-chat-panel { width: min(360px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; margin-bottom: 10px; background: #fff; border: 1px solid #c9d6f2; border-radius: 12px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.2); font-size: 14px; color: #222; }
    .cg-chat-panel form { display: flex; flex-wrap: wrap; gap: 8px; }
    .cg-chat-panel label { flex: 1 1 100%; }
    .cg-chat-panel input { flex: 1 1 150px; padding: 9px 10px; border: 1px solid #b9c3d9; border-radius: 6px; font-size: 16px; }
    .cg-chat-panel button { background: #243b6b; color: #fff; border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
    .cg-chat-item { border-top: 1px solid #e5e9f3; padding: 8px 0; }
    .cg-chat-item a { color: #243b6b; font-weight: bold; }
    .cg-chat-item small { color: #55607a; display: block; }
    .cg-chat-help { background: #eef3ff; border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
    .cg-chat-note { color: #55607a; font-size: 12px; margin: 10px 0 0; }
</style>
<script>
(function () {
    var toggle = document.getElementById("cg-chat-toggle");
    var panel = document.getElementById("cg-chat-panel");
    var form = document.getElementById("cg-chat-form");
    var out = document.getElementById("cg-chat-out");
    if (!toggle || !panel || !form || !window.fetch) { return; }
    toggle.hidden = false;
    toggle.addEventListener("click", function () {
        var open = panel.hidden;
        panel.hidden = !open;
        toggle.setAttribute("aria-expanded", String(open));
        if (open) { document.getElementById("cg-chat-q").focus(); }
    });
    form.addEventListener("submit", function (event) {
        event.preventDefault();
        var q = document.getElementById("cg-chat-q").value.trim();
        if (!q) { return; }
        out.textContent = "Searching...";
        fetch("{% url 'ask_api' %}?q=" + encodeURIComponent(q), { headers: { "Accept": "application/json" } })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                out.textContent = "";
                if (!data.results.length) {
                    var none = document.createElement("p");
                    none.textContent = "We could not find this in Career Gateway's information. A career counsellor can help with questions like this.";
                    out.appendChild(none);
                }
                if (data.handoff && data.handoff.length) {
                    var help = document.createElement("p");
                    help.className = "cg-chat-help";
                    help.textContent = "A career counsellor can help here (" + data.handoff.join(", ") + "). ";
                    var req = document.createElement("a");
                    req.href = "{% url 'counsellor_request' %}";
                    req.textContent = "Request a counsellor";
                    help.appendChild(req);
                    out.appendChild(help);
                }
                data.results.forEach(function (item) {
                    var box = document.createElement("div");
                    box.className = "cg-chat-item";
                    var link = document.createElement("a");
                    link.href = item.url;
                    link.textContent = item.title;
                    var meta = document.createElement("small");
                    meta.textContent = item.kind + (item.verified ? ", verified" : ", not verified yet") + (item.demo ? ", fictional demo" : "");
                    var text = document.createElement("span");
                    text.textContent = item.snippet;
                    box.appendChild(link); box.appendChild(meta); box.appendChild(text);
                    out.appendChild(box);
                });
                var more = document.createElement("p");
                var all = document.createElement("a");
                all.href = form.action + "?q=" + encodeURIComponent(q);
                all.textContent = "See full results";
                more.appendChild(all);
                out.appendChild(more);
            })
            .catch(function () {
                out.textContent = "Something went wrong. Please try the full search page.";
            });
    });
})();
</script>
