<div id="cg-chat" class="cg-chat" aria-label="Ask Career Gateway">
    <div id="cg-chat-panel" class="cg-chat-panel" hidden>
        <div class="cg-chat-head">
            <strong>Ask Career Gateway</strong>
            <button type="button" id="cg-chat-close" class="cg-chat-close" aria-label="Close chat">&times;</button>
        </div>
        <form id="cg-chat-form" action="{% url 'ask' %}" method="get" role="search">
            <label for="cg-chat-q" class="cg-chat-sr">Your question</label>
            <input id="cg-chat-q" name="q" type="text" maxlength="200" placeholder="For example: what is an entrance exam?" autocomplete="off">
            <button type="submit">Ask</button>
            <button type="button" id="cg-chat-clear" class="cg-chat-clear" hidden>Clear</button>
        </form>
        <div id="cg-chat-out" aria-live="polite"></div>
        <p class="cg-chat-note">Answers are written only from Career Gateway records. Please do not type personal details. A counsellor can help with personal decisions.</p>
    </div>
    <button type="button" id="cg-chat-toggle" class="cg-chat-toggle" aria-expanded="false" aria-controls="cg-chat-panel" hidden>Ask a question</button>
    <noscript><a class="cg-chat-link" href="{% url 'ask' %}">Ask a question</a></noscript>
</div>
<style>
    .cg-chat { position: fixed; right: 16px; bottom: 16px; z-index: 50; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; align-items: flex-end; }
    .cg-chat-toggle, .cg-chat-link { background: linear-gradient(135deg, #2f4a85, #243b6b); color: #fff; border: 0; border-radius: 999px; padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 18px rgba(36,59,107,.4); text-decoration: none; display: inline-block; }
    .cg-chat-panel { width: min(400px, calc(100vw - 24px)); max-height: calc(100vh - 96px); max-height: calc(100dvh - 96px); display: flex; flex-direction: column; margin-bottom: 10px; background: #fff; border: 1px solid #c9d6f2; border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.25); font-size: 14px; color: #1f2937; overflow: hidden; }
    .cg-chat-panel[hidden] { display: none; }
    .cg-chat-head { display: flex; justify-content: space-between; align-items: center; background: #243b6b; color: #fff; padding: 12px 14px; }
    .cg-chat-panel .cg-chat-close { background: transparent; color: #fff; border: 0; font-size: 24px; line-height: 1; padding: 0 4px; cursor: pointer; }
    .cg-chat-panel form { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px 4px; }
    .cg-chat-sr { position: absolute; left: -9999px; }
    .cg-chat-panel input { flex: 1 1 150px; padding: 10px 12px; border: 1px solid #b9c3d9; border-radius: 10px; font-size: 16px; }
    .cg-chat-panel form button { background: #243b6b; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
    .cg-chat-panel button.cg-chat-clear { background: #e8ecf5; color: #243b6b; }
    #cg-chat-out { overflow-y: auto; padding: 4px 14px 6px; flex: 1 1 auto; }
    .cg-chat-asked { background: #243b6b; color: #fff; border-radius: 14px 14px 2px 14px; padding: 8px 12px; margin: 10px 0 8px auto; max-width: 90%; width: fit-content; word-break: break-word; }
    .cg-chat-answer { background: #f1f5ff; border: 1px solid #c9d6f2; border-radius: 14px 14px 14px 2px; padding: 10px 12px; margin: 8px 0; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .cg-chat-tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: #243b6b; color: #fff; padding: 2px 8px; border-radius: 999px; margin-bottom: 4px; }
    .cg-chat-sub { color: #55607a; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 2px; }
    .cg-chat-status { color: #55607a; margin: 8px 0; }
    .cg-chat-item { border-top: 1px solid #e5e9f3; padding: 8px 0; }
    .cg-chat-item a { color: #243b6b; font-weight: bold; }
    .cg-chat-item small { color: #55607a; display: block; }
    .cg-chat-help { background: #eef3ff; border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
    .cg-chat-note { color: #55607a; font-size: 12px; margin: 0; padding: 8px 14px 12px; border-top: 1px solid #eef0f6; }
    @media (max-width: 480px) {
        .cg-chat { right: 12px; bottom: 12px; }
        .cg-chat-panel { width: calc(100vw - 24px); }
    }
</style>
<script>
(function () {
    var toggle = document.getElementById("cg-chat-toggle");
    var panel = document.getElementById("cg-chat-panel");
    var form = document.getElementById("cg-chat-form");
    var out = document.getElementById("cg-chat-out");
    var input = document.getElementById("cg-chat-q");
    var clearBtn = document.getElementById("cg-chat-clear");
    var closeBtn = document.getElementById("cg-chat-close");
    if (!toggle || !panel || !form || !window.fetch) { return; }
    toggle.hidden = false;

    // Each search gets a number. A late reply to an older search is ignored,
    // so an old answer can never overwrite a newer question.
    var requestId = 0;

    function clearAnswer() {
        requestId += 1;
        out.textContent = "";
        clearBtn.hidden = true;
    }

    toggle.addEventListener("click", function () {
        var open = panel.hidden;
        panel.hidden = !open;
        toggle.setAttribute("aria-expanded", String(open));
        if (open) { input.focus(); }
    });

    closeBtn.addEventListener("click", function () {
        panel.hidden = true;
        toggle.setAttribute("aria-expanded", "false");
        toggle.focus();
    });

    // Typing a new question removes the previous answer straight away.
    input.addEventListener("input", function () {
        if (out.childNodes.length) { clearAnswer(); }
    });

    clearBtn.addEventListener("click", function () {
        clearAnswer();
        input.value = "";
        input.focus();
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        var q = input.value.trim();
        if (!q) { return; }
        requestId += 1;
        var myId = requestId;
        out.textContent = "";
        clearBtn.hidden = false;
        var asked = document.createElement("p");
        asked.className = "cg-chat-asked";
        asked.textContent = "You asked: " + q;
        out.appendChild(asked);
        var status = document.createElement("p");
        status.className = "cg-chat-status";
        status.textContent = "Reading the records...";
        out.appendChild(status);
        fetch("{% url 'ask_api' %}?q=" + encodeURIComponent(q), { headers: { "Accept": "application/json" } })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (myId !== requestId) { return; }
                out.textContent = "";
                out.appendChild(asked);
                if (!data.results.length) {
                    var none = document.createElement("p");
                    none.textContent = "We could not find this in Career Gateway's information. A career counsellor can help with questions like this.";
                    out.appendChild(none);
                }
                if (data.handoff && data.handoff.length) {
                    var help = document.createElement("p");
                    help.className = "cg-chat-help";
                    help.textContent = "A career counsellor can help here (" + data.handoff.join(", ") + "). ";
                    var req = document.createElement("a");
                    req.href = "{% url 'counsellor_request' %}";
                    req.textContent = "Request a counsellor";
                    help.appendChild(req);
                    out.appendChild(help);
                }

                if (data.answer) {
                    var ans = document.createElement("div");
                    ans.className = "cg-chat-answer";
                    var tag = document.createElement("span");
                    tag.className = "cg-chat-tag";
                    tag.textContent = "AI-written answer";
                    var body = document.createElement("div");
                    body.textContent = data.answer;
                    ans.appendChild(tag); ans.appendChild(body);
                    out.appendChild(ans);
                } else if (data.answer_note) {
                    var wait = document.createElement("p");
                    wait.className = "cg-chat-status";
                    wait.textContent = data.answer_note === "busy"
                        ? "Many questions right now, so the written answer is paused. Records are shown below."
                        : "The written answer is not available right now. Records are shown below.";
                    out.appendChild(wait);
                }
                if (data.results.length) {
                    var sub = document.createElement("div");
                    sub.className = "cg-chat-sub";
                    sub.textContent = "Sources";
                    out.appendChild(sub);
                }
                data.results.forEach(function (item, index) {
                    var box = document.createElement("div");
                    box.className = "cg-chat-item";
                    var link = document.createElement("a");
                    link.href = item.url;
                    link.textContent = "[" + (index + 1) + "] " + item.title;
                    var meta = document.createElement("small");
                    meta.textContent = item.kind + (item.verified ? ", verified" : ", not verified yet") + (item.demo ? ", fictional demo" : "");
                    var text = document.createElement("span");
                    text.textContent = item.snippet;
                    box.appendChild(link); box.appendChild(meta); box.appendChild(text);
                    out.appendChild(box);
                });
                var more = document.createElement("p");
                var all = document.createElement("a");
                all.href = form.action + "?q=" + encodeURIComponent(q);
                all.textContent = "See full results";
                more.appendChild(all);
                out.appendChild(more);
            })
            .catch(function () {
                if (myId !== requestId) { return; }
                out.textContent = "";
                out.appendChild(asked);
                var err = document.createElement("p");
                err.textContent = "Something went wrong. Please try the full search page.";
                out.appendChild(err);
            });
    });
})();
</script>
